<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" style="background: #0f1523; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="cragGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <text x="450" y="40" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700">Agentic Corrective RAG (CRAG) State Flow</text>
  <text x="450" y="64" text-anchor="middle" fill="#94a3b8" font-size="13">Self-Evaluating Decision Loops &amp; Dynamic Query Transformations in LangGraph</text>

  <g transform="translate(60, 95)">
    <!-- Start: Query -->
    <rect x="20" y="100" width="150" height="55" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="95" y="125" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">User Query</text>
    <text x="95" y="142" text-anchor="middle" fill="#94a3b8" font-size="10">State: question</text>

    <!-- Arrow 1 -->
    <line x1="170" y1="127" x2="220" y2="127" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="225,127 215,122 215,132" fill="#38bdf8"/>

    <!-- Node 1: Retriever -->
    <rect x="230" y="100" width="160" height="55" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="310" y="125" text-anchor="middle" fill="#818cf8" font-size="12" font-weight="700">1. Hybrid Retrieve</text>
    <text x="310" y="142" text-anchor="middle" fill="#94a3b8" font-size="10">Dense + BM25</text>

    <!-- Arrow 2 -->
    <line x1="390" y1="127" x2="440" y2="127" stroke="#818cf8" stroke-width="2"/>
    <polygon points="445,127 435,122 435,132" fill="#818cf8"/>

    <!-- Node 2: Evaluator Diamond / Box -->
    <rect x="450" y="90" width="170" height="75" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="535" y="118" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="700">2. Document Evaluator</text>
    <text x="535" y="136" text-anchor="middle" fill="#fef3c7" font-size="10">Sufficient Evidence?</text>
    <text x="535" y="152" text-anchor="middle" fill="#64748b" font-size="9">Gemini 2.0 Flash Guard</text>

    <!-- Branch A: Pass (Right) -->
    <line x1="620" y1="127" x2="680" y2="127" stroke="#10b981" stroke-width="2"/>
    <polygon points="685,127 675,122 675,132" fill="#10b981"/>
    <text x="650" y="118" text-anchor="middle" fill="#10b981" font-size="10" font-weight="700">PASS</text>

    <!-- Node 3: Generator -->
    <rect x="690" y="100" width="160" height="55" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="770" y="125" text-anchor="middle" fill="#10b981" font-size="12" font-weight="700">3. Answer Generator</text>
    <text x="770" y="142" text-anchor="middle" fill="#94a3b8" font-size="10">Strict Grounded Context</text>

    <!-- Branch B: Fail / Retry (Down and Loop) -->
    <path d="M 535 165 L 535 230 L 400 230" stroke="#ef4444" stroke-width="2"/>
    <polygon points="395,230 405,225 405,235" fill="#ef4444"/>
    <text x="475" y="222" text-anchor="middle" fill="#ef4444" font-size="10" font-weight="700">FAIL / AMBIGUOUS</text>

    <!-- Node 4: Query Rewriter / Fallback -->
    <rect x="230" y="200" width="160" height="60" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="310" y="225" text-anchor="middle" fill="#f87171" font-size="12" font-weight="700">Query Rewrite Node</text>
    <text x="310" y="242" text-anchor="middle" fill="#94a3b8" font-size="10">Decompose &amp; Fallback</text>

    <!-- Loop back up to Retrieve -->
    <path d="M 310 200 L 310 160" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3"/>
    <polygon points="310,155 305,165 315,165" fill="#ef4444"/>
    <text x="250" y="180" text-anchor="middle" fill="#f87171" font-size="9">(Max 2 Retries)</text>
  </g>
</svg>
