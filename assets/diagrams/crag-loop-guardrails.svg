<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3b82f6" />
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect width="960" height="480" rx="16" fill="url(#bgGrad3)" stroke="#334155" stroke-width="1.5" />

  <!-- Title Badge & Header -->
  <rect x="40" y="24" width="220" height="26" rx="13" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1"/>
  <text x="52" y="41" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">CRAG RESILIENCE &amp; SAFETY</text>
  <text x="40" y="78" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Corrective RAG State Loop with Hard Circuit Breakers</text>

  <!-- Node 1: Retrieval Node -->
  <g transform="translate(40, 150)" filter="url(#shadow3)">
    <rect width="140" height="90" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="14" y="32" fill="#60a5fa" font-family="sans-serif" font-size="13" font-weight="700">1. Retrieve</text>
    <text x="14" y="54" fill="#94a3b8" font-family="sans-serif" font-size="11">Fetch top-K from</text>
    <text x="14" y="70" fill="#94a3b8" font-family="sans-serif" font-size="11">Internal Store</text>
  </g>

  <!-- Node 2: Grader Node -->
  <g transform="translate(230, 130)" filter="url(#shadow3)">
    <rect width="210" height="130" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="16" y="30" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="700">2. Document Grader</text>
    <line x1="16" y1="40" x2="194" y2="40" stroke="#334155"/>
    <text x="16" y="62" fill="#10b981" font-family="monospace" font-size="11">Score &gt;= 0.8 : CORRECT</text>
    <text x="16" y="82" fill="#f59e0b" font-family="monospace" font-size="11">0.4 - 0.79   : AMBIGUOUS</text>
    <text x="16" y="102" fill="#ef4444" font-family="monospace" font-size="11">Score &lt; 0.4  : INCORRECT</text>
  </g>

  <!-- Connect 1 to 2 -->
  <line x1="180" y1="195" x2="225" y2="195" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrB)"/>

  <!-- Path A: Correct -> Direct Generate -->
  <g transform="translate(500, 110)" filter="url(#shadow3)">
    <rect width="160" height="60" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="16" y="26" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">Direct Synthesis</text>
    <text x="16" y="44" fill="#a7f3d0" font-family="sans-serif" font-size="11">Generate answer [END]</text>
  </g>
  <path d="M 440 160 L 495 140" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrG)"/>

  <!-- Path B: Ambiguous / Incorrect -> Circuit Breaker Check -->
  <g transform="translate(480, 210)" filter="url(#shadow3)">
    <rect width="200" height="110" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect x="12" y="10" width="100" height="18" rx="3" fill="#ef4444" fill-opacity="0.2"/>
    <text x="18" y="23" fill="#fca5a5" font-family="sans-serif" font-size="9.5" font-weight="700">CIRCUIT BREAKER</text>
    <text x="14" y="48" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="700">retry_count &gt;= 2 ?</text>
    <line x1="14" y1="58" x2="186" y2="58" stroke="#334155"/>
    <text x="14" y="78" fill="#34d399" font-family="sans-serif" font-size="11">NO  -&gt; Rewrite Query</text>
    <text x="14" y="96" fill="#f87171" font-family="sans-serif" font-size="11">YES -&gt; Fallback / Abstain</text>
  </g>
  <path d="M 440 215 L 475 240" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrO)"/>

  <!-- Path C1: YES -> Circuit Tripped Node -->
  <g transform="translate(730, 210)" filter="url(#shadow3)">
    <rect width="190" height="110" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="16" y="28" fill="#fca5a5" font-family="sans-serif" font-size="12" font-weight="700">Emergency Fallback</text>
    <text x="16" y="52" fill="#fecaca" font-family="sans-serif" font-size="11">1. Query External Search</text>
    <text x="16" y="70" fill="#fecaca" font-family="sans-serif" font-size="11">2. Or state uncertainty</text>
    <text x="16" y="90" fill="#f87171" font-family="sans-serif" font-size="10" font-weight="600">Zero infinite loops [END]</text>
  </g>
  <path d="M 680 265 L 725 265" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrR)"/>

  <!-- Path C2: NO -> Rewrite & Loop Back -->
  <g transform="translate(260, 320)" filter="url(#shadow3)">
    <rect width="180" height="70" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="14" y="26" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="700">Rewrite Query</text>
    <text x="14" y="44" fill="#94a3b8" font-family="monospace" font-size="11">retry_count += 1</text>
    <text x="14" y="60" fill="#94a3b8" font-family="sans-serif" font-size="10">Decompose / expand terms</text>
  </g>

  <!-- Connect Circuit breaker NO to Rewrite -->
  <path d="M 520 320 L 520 355 L 445 355" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrO)"/>
  <!-- Connect Rewrite back to Retrieve -->
  <path d="M 260 355 L 110 355 L 110 245" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrO)"/>

  <!-- Bottom Explanatory Bar -->
  <rect x="40" y="415" width="880" height="42" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="60" y="441" fill="#94a3b8" font-family="sans-serif" font-size="12">🛡️ <tspan fill="#f1f5f9" font-weight="600">State Machine Invariant:</tspan> Any agentic loop without a hard monotonic counter creates unbounded latency spikes and cost blowouts.</text>
</svg>
