<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="440" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="450" y="40" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" fill="#f8fafc">The 1-Keyword Delta: Global Vector Collapse vs. Cross-Encoder Disambiguation</text>
  <text x="450" y="65" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" fill="#94a3b8">Why 1536-dimensional embeddings fail on fine-grained keyword variations — and how cross-encoders rescue precision</text>

  <!-- Left Panel: Dense Embedding Space (Failure) -->
  <rect x="30" y="90" width="400" height="320" rx="12" fill="#131d33" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 2"/>
  <rect x="50" y="105" width="130" height="24" rx="6" fill="#7f1d1d"/>
  <text x="115" y="121" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#fca5a5">DENSE VECTOR SPACE</text>

  <!-- Vector Collision Circles -->
  <circle cx="160" cy="220" r="70" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="230" cy="220" r="70" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="3 3"/>

  <circle cx="170" cy="210" r="6" fill="#38bdf8"/>
  <text x="160" y="195" text-anchor="end" font-family="monospace" font-size="11" fill="#38bdf8">"return policy for shoes"</text>

  <circle cx="210" cy="215" r="6" fill="#c084fc"/>
  <text x="220" y="195" text-anchor="start" font-family="monospace" font-size="11" fill="#c084fc">"return policy for electronics"</text>

  <!-- Collision Indicator -->
  <rect x="110" y="270" width="240" height="50" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="230" y="290" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc">Cosine Similarity: 0.975 (Collision)</text>
  <text x="230" y="308" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">90% shared tokens dilute 1-word critical delta</text>

  <text x="230" y="380" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#ef4444">❌ Result: Wrong department policy retrieved</text>

  <!-- Right Panel: Cross-Encoder Attention Matrix (Resolution) -->
  <rect x="470" y="90" width="400" height="320" rx="12" fill="#131d33" stroke="#10b981" stroke-width="1.5"/>
  <rect x="490" y="105" width="160" height="24" rx="6" fill="#064e3b"/>
  <text x="570" y="121" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">CROSS-ENCODER ATTENTION</text>

  <!-- Token Matrix Representation -->
  <g transform="translate(510, 150)">
    <!-- Column Headers (Query) -->
    <text x="90" y="0" font-family="monospace" font-size="11" fill="#38bdf8">return</text>
    <text x="150" y="0" font-family="monospace" font-size="11" fill="#38bdf8">policy</text>
    <text x="220" y="0" font-family="monospace" font-size="11" font-weight="700" fill="#fbbf24">electronics</text>

    <!-- Row 1: Document Footwear -->
    <text x="0" y="35" font-family="monospace" font-size="11" fill="#94a3b8">Doc: shoes</text>
    <rect x="90" y="20" width="40" height="22" rx="4" fill="#0284c7" opacity="0.6"/>
    <rect x="150" y="20" width="40" height="22" rx="4" fill="#0284c7" opacity="0.7"/>
    <rect x="225" y="20" width="40" height="22" rx="4" fill="#ef4444" opacity="0.8"/>
    <text x="245" y="35" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#fff">0.02</text>

    <!-- Row 2: Document Electronics -->
    <text x="0" y="75" font-family="monospace" font-size="11" fill="#94a3b8">Doc: gadgets</text>
    <rect x="90" y="60" width="40" height="22" rx="4" fill="#0284c7" opacity="0.6"/>
    <rect x="150" y="60" width="40" height="22" rx="4" fill="#0284c7" opacity="0.7"/>
    <rect x="225" y="60" width="40" height="22" rx="4" fill="#10b981" opacity="0.9"/>
    <text x="245" y="75" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#fff">0.96</text>
  </g>

  <!-- Resolution Box -->
  <rect x="510" y="270" width="320" height="50" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="670" y="290" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#6ee7b7">Full Cross-Attention Resolves Delta</text>
  <text x="670" y="308" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#a7f3d0">Footwear Doc dropped to Rank #48; Tech Doc promoted to #1</text>

  <text x="670" y="380" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#10b981">✓ Result: 100% precision on subtle semantic deltas</text>
</svg>
