<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" style="background: #0f1523; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="badGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="goodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700" letter-spacing="-0.5">The Evolution of Visual Document Retrieval</text>
  <text x="450" y="66" text-anchor="middle" fill="#94a3b8" font-size="13">Naive OCR Flattener vs. Native Patch-Level Late Interaction (ColPali)</text>

  <!-- LEFT: Naive OCR Pipeline (Flawed) -->
  <g transform="translate(40, 95)">
    <rect x="0" y="0" width="380" height="345" rx="10" fill="url(#badGrad)" stroke="rgba(239,68,68,0.4)" stroke-width="1.5"/>
    <rect x="18" y="16" width="130" height="24" rx="4" fill="rgba(239,68,68,0.2)"/>
    <text x="83" y="32" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="700">NAIVE OCR PIPELINE</text>

    <!-- Document simulation -->
    <rect x="25" y="55" width="90" height="120" rx="4" fill="#1e293b" stroke="#475569"/>
    <!-- Tables and chart representation -->
    <rect x="35" y="70" width="30" height="8" fill="#64748b"/>
    <rect x="70" y="70" width="35" height="8" fill="#64748b"/>
    <rect x="35" y="85" width="70" height="40" fill="#334155" stroke="#475569" stroke-dasharray="2,2"/>
    <path d="M 40 115 L 55 95 L 75 105 L 95 90" fill="none" stroke="#ef4444" stroke-width="2"/>
    <text x="70" y="190" text-anchor="middle" fill="#94a3b8" font-size="11">PDF Page Image</text>

    <!-- Arrow -->
    <path d="M 125 115 L 170 115" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowBad)"/>
    <polygon points="175,115 165,110 165,120" fill="#ef4444"/>

    <!-- Tesseract OCR box -->
    <rect x="180" y="85" width="170" height="60" rx="6" fill="#1e293b" stroke="rgba(239,68,68,0.5)"/>
    <text x="265" y="110" text-anchor="middle" fill="#f87171" font-size="12" font-weight="700">Tesseract / OCR Tool</text>
    <text x="265" y="128" text-anchor="middle" fill="#94a3b8" font-size="10">Erases tables &amp; charts</text>

    <!-- Arrow down -->
    <path d="M 265 150 L 265 190" stroke="#ef4444" stroke-width="2"/>
    <polygon points="265,195 260,185 270,185" fill="#ef4444"/>

    <!-- Word soup result -->
    <rect x="25" y="205" width="330" height="115" rx="6" fill="#0f172a" stroke="rgba(239,68,68,0.3)"/>
    <text x="40" y="228" fill="#fca5a5" font-size="11" font-weight="700">❌ Catastrophic Context Destruction:</text>
    <text x="40" y="248" fill="#cbd5e1" font-size="10" font-family="monospace">"Q3 2025 Revenue 4.2M 1.1M Margins 12%</text>
    <text x="40" y="264" fill="#cbd5e1" font-size="10" font-family="monospace">Operating Cost Tax Net Income (2.4M)..."</text>
    <text x="40" y="290" fill="#94a3b8" font-size="10">• Column borders lost &bull; Chart lines erased</text>
    <text x="40" y="306" fill="#94a3b8" font-size="10">• High hallucination risk during LLM retrieval</text>
  </g>

  <!-- RIGHT: ColPali Native Visual Patches (Modern) -->
  <g transform="translate(480, 95)">
    <rect x="0" y="0" width="380" height="345" rx="10" fill="url(#goodGrad)" stroke="rgba(56,189,248,0.4)" stroke-width="1.5"/>
    <rect x="18" y="16" width="140" height="24" rx="4" fill="rgba(56,189,248,0.2)"/>
    <text x="88" y="32" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700">COLPALI VISUAL PATCHES</text>

    <!-- Document simulation with Patch Grid -->
    <rect x="25" y="55" width="90" height="120" rx="4" fill="#1e293b" stroke="#38bdf8"/>
    <!-- 4x4 Grid representation -->
    <line x1="47" y1="55" x2="47" y2="175" stroke="rgba(56,189,248,0.4)" stroke-width="1"/>
    <line x1="70" y1="55" x2="70" y2="175" stroke="rgba(56,189,248,0.4)" stroke-width="1"/>
    <line x1="92" y1="55" x2="92" y2="175" stroke="rgba(56,189,248,0.4)" stroke-width="1"/>
    <line x1="25" y1="85" x2="115" y2="85" stroke="rgba(56,189,248,0.4)" stroke-width="1"/>
    <line x1="25" y1="115" x2="115" y2="115" stroke="rgba(56,189,248,0.4)" stroke-width="1"/>
    <line x1="25" y1="145" x2="115" y2="145" stroke="rgba(56,189,248,0.4)" stroke-width="1"/>
    <!-- Highlighted patch -->
    <rect x="70" y="85" width="22" height="30" fill="rgba(56,189,248,0.6)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="70" y="190" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="600">ViT Visual Grid (1024)</text>

    <!-- Arrow -->
    <path d="M 125 115 L 170 115" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="175,115 165,110 165,120" fill="#38bdf8"/>

    <!-- Late Interaction Engine -->
    <rect x="180" y="85" width="170" height="60" rx="6" fill="#1e293b" stroke="rgba(56,189,248,0.5)"/>
    <text x="265" y="110" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">Late Interaction MaxSim</text>
    <text x="265" y="128" text-anchor="middle" fill="#bae6fd" font-size="10">SigLIP + PaliGemma</text>

    <!-- Arrow down -->
    <path d="M 265 150 L 265 190" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="265,195 260,185 270,185" fill="#38bdf8"/>

    <!-- High fidelity result -->
    <rect x="25" y="205" width="330" height="115" rx="6" fill="#0f172a" stroke="rgba(56,189,248,0.3)"/>
    <text x="40" y="228" fill="#38bdf8" font-size="11" font-weight="700">✅ Native Layout &amp; Semantic Preservation:</text>
    <text x="40" y="250" fill="#cbd5e1" font-size="10">&bull; Query word "trend" matches visual chart curve</text>
    <text x="40" y="268" fill="#cbd5e1" font-size="10">&bull; Multi-column tables queried with 100% spatial fidelity</text>
    <text x="40" y="286" fill="#cbd5e1" font-size="10">&bull; Zero OCR dependency &bull; Sub-40ms vector retrieval</text>
    <text x="40" y="306" fill="#10b981" font-size="10" font-weight="700">&bull; 99.4% precision on complex financial tables</text>
  </g>
</svg>
