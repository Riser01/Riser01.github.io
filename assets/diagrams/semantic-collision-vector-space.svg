<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%" style="background: #0f1523; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <radialGradient id="collisionZone" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.0"/>
    </radialGradient>
    <radialGradient id="safeZone" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="460" y="38" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700">The 1-Keyword Delta Semantic Collision Problem</text>
  <text x="460" y="62" text-anchor="middle" fill="#94a3b8" font-size="13">Why Vector Cosine Similarity Poisoning Happens &amp; How Hybrid Late Interaction Disentangles It</text>

  <!-- Left: Naive Dense Vector Space (Failure) -->
  <g transform="translate(40, 85)">
    <rect x="0" y="0" width="400" height="360" rx="10" fill="#131c2e" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="30" fill="#f43f5e" font-size="14" font-weight="700">❌ Naive Dense Vector Embedding Space</text>
    <text x="20" y="48" fill="#94a3b8" font-size="11">Single-vector pooling blurs exact syntax and negations</text>

    <!-- Collision Glow Zone -->
    <circle cx="200" cy="180" r="110" fill="url(#collisionZone)"/>
    <circle cx="200" cy="180" r="80" stroke="#f43f5e" stroke-dasharray="4,4" fill="none" stroke-width="1"/>

    <!-- Query Vector A -->
    <line x1="200" y1="180" x2="160" y2="130" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
    <circle cx="160" cy="130" r="5" fill="#38bdf8"/>
    <rect x="30" y="105" width="120" height="42" rx="6" fill="#1e293b" stroke="#38bdf8"/>
    <text x="90" y="122" text-anchor="middle" fill="#f1f5f9" font-size="10" font-weight="600">Query A:</text>
    <text x="90" y="136" text-anchor="middle" fill="#38bdf8" font-size="9">"how to reset password"</text>

    <!-- Query Vector B -->
    <line x1="200" y1="180" x2="240" y2="135" stroke="#f43f5e" stroke-width="2.5" marker-end="url(#arrowRed)"/>
    <circle cx="240" cy="135" r="5" fill="#f43f5e"/>
    <rect x="250" y="110" width="135" height="42" rx="6" fill="#1e293b" stroke="#f43f5e"/>
    <text x="317" y="127" text-anchor="middle" fill="#f1f5f9" font-size="10" font-weight="600">Opposite Query B:</text>
    <text x="317" y="141" text-anchor="middle" fill="#f87171" font-size="9">"how NOT to reset password"</text>

    <!-- Cosine Metric Tag -->
    <rect x="120" y="225" width="160" height="40" rx="6" fill="#2d151e" stroke="#f43f5e"/>
    <text x="200" y="242" text-anchor="middle" fill="#f87171" font-size="11" font-weight="700">Cosine Similarity: 0.982</text>
    <text x="200" y="256" text-anchor="middle" fill="#fda4af" font-size="9">Fatal False-Positive Cache Hit!</text>

    <!-- Outcome Note -->
    <rect x="15" y="295" width="370" height="50" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="200" y="316" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="600">Result: Dangerous Cache Contamination</text>
    <text x="200" y="332" text-anchor="middle" fill="#94a3b8" font-size="10">User asking what NOT to do receives instructions TO do it.</text>
  </g>

  <!-- Right: Hybrid & Late Interaction Space (Solution) -->
  <g transform="translate(480, 85)">
    <rect x="0" y="0" width="400" height="360" rx="10" fill="#131c2e" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="30" fill="#10b981" font-size="14" font-weight="700">✅ Hybrid + Late Interaction (ColBERT/BM25)</text>
    <text x="20" y="48" fill="#94a3b8" font-size="11">Exact token penalties + all-to-all token alignment</text>

    <!-- Safe Zones -->
    <circle cx="110" cy="170" r="60" fill="url(#safeZone)"/>
    <circle cx="290" cy="170" r="60" fill="url(#safeZone)"/>

    <!-- Disentangled Node A -->
    <rect x="25" y="145" width="170" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="110" y="167" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700">Action Cluster (Allow)</text>
    <text x="110" y="183" text-anchor="middle" fill="#94a3b8" font-size="9">"reset password standard flow"</text>

    <!-- Disentangled Node B -->
    <rect x="205" y="145" width="170" height="50" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="290" y="167" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">Negative/Warning Cluster</text>
    <text x="290" y="183" text-anchor="middle" fill="#94a3b8" font-size="9">"security risks &amp; forbidden steps"</text>

    <!-- Token-Level Repulsion Arrow -->
    <path d="M 195 170 L 205 170" stroke="#f59e0b" stroke-width="2"/>
    <text x="200" y="130" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="700">BM25 / Token MaxSim</text>
    <text x="200" y="142" text-anchor="middle" fill="#cbd5e1" font-size="9">Negation Penalty &rarr; Repelled</text>

    <!-- Metric Tag -->
    <rect x="120" y="225" width="160" height="40" rx="6" fill="#064e3b" stroke="#10b981"/>
    <text x="200" y="242" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">Separation Score: &Delta; 0.64</text>
    <text x="200" y="256" text-anchor="middle" fill="#a7f3d0" font-size="9">Correctly Routed to Distinct Contexts</text>

    <!-- Outcome Note -->
    <rect x="15" y="295" width="370" height="50" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="200" y="316" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="600">Result: Zero Semantic Bleed</text>
    <text x="200" y="332" text-anchor="middle" fill="#94a3b8" font-size="10">Exact keywords lock down scope before vector ranking executes.</text>
  </g>
</svg>
