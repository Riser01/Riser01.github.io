<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" style="background: #0f1523; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="funnelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <text x="450" y="40" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700">Multi-Stage Hybrid Retrieval Funnel</text>
  <text x="450" y="64" text-anchor="middle" fill="#94a3b8" font-size="13">Dense Semantic + Sparse Lexical &rarr; RRF Consensus &rarr; Cross-Encoder Re-Ranking</text>

  <g transform="translate(60, 95)">
    <!-- Stage 0: User Query -->
    <rect x="250" y="0" width="280" height="45" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="390" y="27" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">User Query: "return policy for shoes"</text>

    <!-- Branch to Stage 1 -->
    <path d="M 330 45 L 200 80" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 450 45 L 580 80" stroke="#818cf8" stroke-width="2"/>

    <!-- Stage 1A: Dense Search -->
    <rect x="80" y="80" width="240" height="70" rx="8" fill="#1e293b" stroke="#38bdf8"/>
    <text x="200" y="105" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">1A. Dense Vector Search</text>
    <text x="200" y="123" text-anchor="middle" fill="#94a3b8" font-size="11">HNSW / Cosine Similarity</text>
    <text x="200" y="139" text-anchor="middle" fill="#bae6fd" font-size="10">Captures Semantics &bull; Top 100</text>

    <!-- Stage 1B: Sparse BM25 -->
    <rect x="460" y="80" width="240" height="70" rx="8" fill="#1e293b" stroke="#818cf8"/>
    <text x="580" y="105" text-anchor="middle" fill="#818cf8" font-size="13" font-weight="700">1B. Sparse Lexical Search</text>
    <text x="580" y="123" text-anchor="middle" fill="#94a3b8" font-size="11">BM25 / Tantivy / Inverted Index</text>
    <text x="580" y="139" text-anchor="middle" fill="#c7d2fe" font-size="10">Captures Exact SKUs &bull; Top 100</text>

    <!-- Converge to Stage 2: RRF -->
    <path d="M 200 150 L 320 185" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 580 150 L 460 185" stroke="#818cf8" stroke-width="2"/>

    <!-- Stage 2: Reciprocal Rank Fusion -->
    <rect x="230" y="185" width="320" height="70" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="390" y="210" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="700">2. Reciprocal Rank Fusion (RRF, k=60)</text>
    <text x="390" y="228" text-anchor="middle" fill="#fef3c7" font-size="11">RRF = &Sigma; 1 / (60 + Rank) &bull; Latency &lt; 1ms</text>
    <text x="390" y="244" text-anchor="middle" fill="#94a3b8" font-size="10">Merged Candidate Pool &bull; Top 50</text>

    <!-- Path to Stage 3: Cross Encoder -->
    <line x1="390" y1="255" x2="390" y2="285" stroke="#f59e0b" stroke-width="2"/>

    <!-- Stage 3: Cross Encoder Re-Ranking -->
    <rect x="200" y="285" width="380" height="75" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="390" y="309" text-anchor="middle" fill="#10b981" font-size="13" font-weight="700">3. Cross-Encoder Re-Ranking (bge-reranker)</text>
    <text x="390" y="327" text-anchor="middle" fill="#bae6fd" font-size="11">Full All-to-All Token Cross-Attention (Query &harr; Doc)</text>
    <text x="390" y="345" text-anchor="middle" fill="#10b981" font-size="10" font-weight="600">Eliminates 1-Keyword Delta Collisions &bull; Top 5 High-Precision Chunks</text>
  </g>
</svg>
