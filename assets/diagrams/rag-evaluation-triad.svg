<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" style="background: #0f1523; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="triadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700">The Production RAG Evaluation Triad</text>
  <text x="450" y="66" text-anchor="middle" fill="#94a3b8" font-size="13">Decoupling Retriever Precision from Generator Groundedness in CI/CD Gates</text>

  <!-- Central Diagram -->
  <g transform="translate(100, 100)">
    <!-- Main Triangle Nodes -->

    <!-- NODE 1: User Query (Top) -->
    <rect x="250" y="0" width="200" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="350" y="27" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">1. User Query</text>
    <text x="350" y="46" text-anchor="middle" fill="#94a3b8" font-size="11">Input Intent &amp; Persona</text>

    <!-- NODE 2: Retrieved Context (Bottom Left) -->
    <rect x="50" y="240" width="220" height="70" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <text x="160" y="267" text-anchor="middle" fill="#818cf8" font-size="13" font-weight="700">2. Retrieved Context</text>
    <text x="160" y="286" text-anchor="middle" fill="#94a3b8" font-size="11">Top-K Candidate Chunks</text>
    <text x="160" y="300" text-anchor="middle" fill="#64748b" font-size="10">Hit Rate • MRR • NDCG@10</text>

    <!-- NODE 3: Generated Answer (Bottom Right) -->
    <rect x="430" y="240" width="220" height="70" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="540" y="267" text-anchor="middle" fill="#10b981" font-size="13" font-weight="700">3. Generated Answer</text>
    <text x="540" y="286" text-anchor="middle" fill="#94a3b8" font-size="11">Synthesized Output Stream</text>
    <text x="540" y="300" text-anchor="middle" fill="#64748b" font-size="10">Target Faithfulness ≥ 0.98</text>

    <!-- EDGE 1: Query <-> Context (Context Relevance) -->
    <line x1="260" y1="60" x2="160" y2="240" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
    <rect x="120" y="130" width="160" height="40" rx="6" fill="#0f172a" stroke="#38bdf8"/>
    <text x="200" y="148" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700">Context Relevance</text>
    <text x="200" y="162" text-anchor="middle" fill="#94a3b8" font-size="9">Is the retrieved info relevant?</text>

    <!-- EDGE 2: Context <-> Answer (Groundedness / Faithfulness) -->
    <line x1="270" y1="275" x2="430" y2="275" stroke="#10b981" stroke-width="2"/>
    <rect x="295" y="255" width="110" height="40" rx="6" fill="#0f172a" stroke="#10b981"/>
    <text x="350" y="273" text-anchor="middle" fill="#10b981" font-size="11" font-weight="700">Faithfulness</text>
    <text x="350" y="287" text-anchor="middle" fill="#94a3b8" font-size="9">Zero hallucination</text>

    <!-- EDGE 3: Query <-> Answer (Answer Relevance) -->
    <line x1="440" y1="60" x2="540" y2="240" stroke="#818cf8" stroke-width="2" stroke-dasharray="4,4"/>
    <rect x="420" y="130" width="160" height="40" rx="6" fill="#0f172a" stroke="#818cf8"/>
    <text x="500" y="148" text-anchor="middle" fill="#818cf8" font-size="11" font-weight="700">Answer Relevance</text>
    <text x="500" y="162" text-anchor="middle" fill="#94a3b8" font-size="9">Did we answer the user's ask?</text>
  </g>
</svg>
